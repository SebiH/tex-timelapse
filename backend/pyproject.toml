[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tex-timelapse"
version = "0.1.0"
description = "Turn the git history of a LaTeX project into a timelapse video."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "alive-progress>=3",
    "ffmpeg-progress-yield>=0.7",
    "gitpython>=3.1",
    "numpy>=1.24",
    "pyyaml>=6",
    "python-slugify>=8",
    "flask>=3",
    "flask-socketio>=5",
    "flask-cors>=4",
    "pypdfium2>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.8",
    "types-Pillow",
    "types-PyYAML",
    "types-python-slugify",
]

[project.scripts]
tex-timelapse = "tex_timelapse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# default_config.yaml is copied into a new project at init time and used as
# the config fallback; it must travel inside the wheel, not just the sdist.
tex_timelapse = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises an optional external binary (e.g. ffmpeg, latexmk); skipped when the binary isn't on PATH.",
]

[tool.mypy]
# .mypy_cache defaults onto the drvfs /mnt mount on the WSL checkout, where
# sqlite cannot open its db; callers should pass --cache-dir off that mount.
python_version = "3.10"
