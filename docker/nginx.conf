# Static file server + reverse proxy for the built web UI (webui/dist).
#
# The React app talks to the Flask backend via *same-origin* relative paths
# (e.g. fetch('/api/projects'), socket.io on '/socket.io') - see webui/src.
# That means whatever serves the built dist/ must also forward /api and
# /socket.io to the Flask+Socket.IO service, exactly like Vite's dev proxy
# (see webui/vite.config.ts) does for `npm run dev`. This config re-creates
# that same proxy for the production build.
#
# The upstream host name "tex-timelapse" is the service name from
# docker-compose.yml, resolved via Docker's embedded DNS - it only works
# when this container runs alongside that service on the same compose
# network.
#
# The upstream must be started with `server --host 0.0.0.0` (as
# docker-compose.yml does): the server binds loopback-only by default, which
# would be unreachable from this container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API
    location /api/ {
        proxy_pass http://tex-timelapse:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (needs the Upgrade/Connection headers for websocket transport)
    location /socket.io/ {
        proxy_pass http://tex-timelapse:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Single-page app: let React Router handle unknown paths
    location / {
        try_files $uri /index.html;
    }
}
